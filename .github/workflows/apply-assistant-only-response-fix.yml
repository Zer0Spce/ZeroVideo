name: Apply assistant-only ChatGPT response fix

on:
  push:
    branches:
      - fix/assistant-only-chatgpt-response

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-only-chatgpt-response
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply-assistant-only-response-fix.py
      - name: Remove temporary helper files
        run: |
          rm tools/apply-assistant-only-response-fix.py
          rm .github/workflows/apply-assistant-only-response-fix.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT response capture to ignore user prompt JSON"
          git push origin HEAD:fix/assistant-only-chatgpt-response
