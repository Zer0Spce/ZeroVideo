name: Apply Clipchamp ready-state fallback
on:
  push:
    branches: [ fix/clipchamp-ready-state-fallback ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clipchamp-ready-state-fallback
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ZeroVideo.App/Services/ClipchampTtsService.cs')
          s = p.read_text(encoding='utf-8')
          old = '''            if ((DateTime.UtcNow - lastLog).TotalSeconds >= 5)
            {
                var detected = duration.HasValue ? $"{duration.Value:0.0}s" : "not readable yet";
                log?.Invoke($"Clipchamp TTS is still synthesizing; detected timeline duration: {detected}.");
                lastLog = DateTime.UtcNow;
            }

            await Task.Delay(1000, ct);
'''
          new = '''            if (!duration.HasValue && DateTime.UtcNow >= notBefore)
            {
                var readyByControls = await IsTtsEditorReadyForExportAsync(page);
                if (readyByControls)
                {
                    stableReadyPolls++;
                    if (stableReadyPolls >= 2)
                    {
                        log?.Invoke("Clipchamp TTS ready: transport duration is not exposed to automation, but Preview is enabled and Save is disabled after synthesis. Export may begin.");
                        return;
                    }
                }
                else
                {
                    stableReadyPolls = 0;
                }
            }

            if ((DateTime.UtcNow - lastLog).TotalSeconds >= 5)
            {
                var detected = duration.HasValue ? $"{duration.Value:0.0}s" : "not readable yet";
                log?.Invoke($"Clipchamp TTS is still synthesizing; detected timeline duration: {detected}.");
                lastLog = DateTime.UtcNow;
            }

            await Task.Delay(1000, ct);
'''
          if old not in s:
              raise SystemExit('wait block not found')
          s = s.replace(old, new, 1)
          anchor = '''    private static async Task<double?> TryReadPlaybackTotalSecondsAsync(IPage page)
'''
          helper = '''    private static async Task<bool> IsTtsEditorReadyForExportAsync(IPage page)
    {
        var previewEnabled = false;
        var saveVisible = false;
        var saveEnabled = false;

        foreach (var frame in page.Frames.Reverse())
        {
            try
            {
                var previews = frame.GetByRole(AriaRole.Button, new() { Name = "Preview", Exact = true });
                var previewCount = await previews.CountAsync();
                for (var i = previewCount - 1; i >= 0; i--)
                {
                    var button = previews.Nth(i);
                    if (await button.IsVisibleAsync() && await button.IsEnabledAsync())
                    {
                        previewEnabled = true;
                        break;
                    }
                }
            }
            catch { }

            try
            {
                var saves = frame.GetByRole(AriaRole.Button, new() { Name = "Save", Exact = true });
                var saveCount = await saves.CountAsync();
                for (var i = saveCount - 1; i >= 0; i--)
                {
                    var button = saves.Nth(i);
                    if (!await button.IsVisibleAsync()) continue;
                    saveVisible = true;
                    if (await button.IsEnabledAsync()) saveEnabled = true;
                }
            }
            catch { }
        }

        return previewEnabled && saveVisible && !saveEnabled;
    }

'''
          if anchor not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ZeroVideo.App/Services/ClipchampTtsService.cs
          git commit -m "Use Clipchamp TTS ready-state fallback"
          git push origin fix/clipchamp-ready-state-fallback
