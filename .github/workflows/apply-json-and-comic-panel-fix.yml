name: Apply JSON and comic panel fix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/chatgpt-json-quoted-text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: python tools/apply_json_and_comic_panel_fix.py

      - name: Remove temporary patch helper
        run: |
          rm -f tools/apply_json_and_comic_panel_fix.py
          rm -f .github/workflows/apply-json-and-comic-panel-fix.yml

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix chapter JSON recovery and comic page composition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
