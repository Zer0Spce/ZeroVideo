name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [ main, feat/windows-longform-generator, feature/youtube-flow-pixabay-stock-2026-11-09, fix/windows-startup-launch-2026-11-17, feature/gaming-news-batch-48-2026-11-18 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ZeroVideo.sln
      - name: Pixabay HTTP 429 and local-cache regression tests (offline)
        run: dotnet run --project tests/PixabayFlowSmoke/PixabayFlowSmoke.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OmniVoice worker smoke tests (offline)
        shell: pwsh
        run: |
          python -m py_compile src/ZeroVideo.App/Resources/omnivoice_worker.py
          python tools/test-omnivoice-worker.py
          python -m py_compile src/ZeroVideo.App/Resources/zerovideo_idle_driver.py
          python -m py_compile src/ZeroVideo.App/Resources/zerovideo_idle_driver_init.py
          python -m py_compile src/ZeroVideo.App/Resources/liveportrait_import_probe.py
          python -m py_compile src/ZeroVideo.App/Resources/liveportrait_face_probe.py
          python -m py_compile src/ZeroVideo.App/Resources/liveportrait_onnx_probe.py
          python tools/test-liveportrait-onnx-preflight.py
          python -m py_compile src/ZeroVideo.App/Resources/pulid_import_probe.py
          python -m py_compile src/ZeroVideo.App/Resources/pulid_flux_compat.py
          python tools/test-pulid-flux-compat.py
      - name: Fetch pinned original PuLID nodes for compatibility test
        uses: actions/checkout@v4
        with:
          repository: lldacing/ComfyUI_PuLID_Flux_ll
          ref: 7c7362b806c2c0f4bde8742ada9e7cb05b44d249
          path: _pulid_vendor_test
          persist-credentials: false
      - name: Verify repair against actual upstream PuLID source
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP "zerovideo_test_flux_model.py"
          Set-Content -Path $model -Value 'class Flux:`n    def forward_orig(self, timestep_zero_index=None): pass' -NoNewline
          python src/ZeroVideo.App/Resources/pulid_flux_compat.py --extension _pulid_vendor_test --flux-model $model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python src/ZeroVideo.App/Resources/pulid_flux_compat.py --extension _pulid_vendor_test --flux-model $model --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python 3.13 LivePortrait dependency compatibility
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MediaPipe Tasks API smoke test (Windows Python 3.13)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "mediapipe==0.10.35" "numpy>=2,<3"
          python -c "import mediapipe as mp; from mediapipe.tasks import python; from mediapipe.tasks.python import vision; import numpy; print('MediaPipe Tasks OK:', numpy.__version__)"
      - name: InsightFace ONNX dependency smoke test (Windows Python 3.13)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --upgrade-strategy only-if-needed "onnx>=1.17,<2" scipy scikit-image scikit-learn requests tqdm onnxruntime
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps "insightface==2.1"
          python -c "import onnx, onnxruntime, scipy, skimage, sklearn, insightface; from insightface.utils import face_align; from insightface.utils.download import download_file; from insightface.utils.storage import BASE_REPO_URL; print('InsightFace ONNX dependency imports OK:', insightface.__version__)"
      - name: Character Bible scene-variety regression tests
        run: dotnet run --project tests/CharacterBibleSmoke/CharacterBibleSmoke.csproj --configuration Release
      - name: Publish portable x64
        shell: pwsh
        run: .\tools\build-portable.ps1
      - name: Bundle YouTube clip downloader for Gaming News
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'dist\ZeroVideo-win-x64\yt-dlp.exe'
          $download = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe'
          $checksums = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS'
          Invoke-WebRequest -Uri $download -OutFile $destination -MaximumRedirection 8
          if (!(Test-Path $destination) -or (Get-Item $destination).Length -lt 3000000) {
            throw 'Unable to retrieve yt-dlp Windows binary'
          }
          $sumFile = Join-Path $env:RUNNER_TEMP 'yt-dlp-SHA2-256SUMS.txt'
          Invoke-WebRequest -Uri $checksums -OutFile $sumFile -MaximumRedirection 8
          $line = Get-Content $sumFile | Where-Object { $_ -match 'yt-dlp\.exe$' } | Select-Object -First 1
          if (!$line) { throw 'Missing yt-dlp.exe SHA256 checksum in release manifest' }
          $expected = ($line -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash $destination -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'yt-dlp Windows binary checksum mismatch' }
          & $destination --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled yt-dlp failed startup test' }
      - name: Smoke test real packaged ZeroVideo.exe startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\ZeroVideo-win-x64\ZeroVideo.exe'
          if (!(Test-Path $exe)) { throw "Missing published ZeroVideo.exe: $exe" }
          $marker = Join-Path $env:RUNNER_TEMP 'zerovideo-startup-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:ZEROVIDEO_STARTUP_SMOKE_MARKER = $marker
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            for ($i = 0; $i -lt 50; $i++) {
              if (Test-Path $marker) { break }
              Start-Sleep -Milliseconds 400
              $app.Refresh()
              if ($app.HasExited) { break }
            }
            if (!(Test-Path $marker)) {
              $exitStatus = if ($app.HasExited) { $app.ExitCode } else { 'still running' }
              $diagnostics = Join-Path $env:LOCALAPPDATA 'ZeroVideo\diagnostics\startup-crash.log'
              if (Test-Path $diagnostics) {
                Write-Host 'ZeroVideo startup diagnostics:'
                Get-Content $diagnostics -Tail 80
              }
              throw "ZeroVideo.exe failed the real Windows WPF startup smoke test (exit: $exitStatus)."
            }
            Get-Content $marker | Write-Host
          }
          finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:ZEROVIDEO_STARTUP_SMOKE_MARKER -ErrorAction SilentlyContinue
          }
      - name: Smoke test Playwright driver from published ZeroVideo.exe
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\ZeroVideo-win-x64\ZeroVideo.exe'
          $driver = Join-Path $env:GITHUB_WORKSPACE 'dist\ZeroVideo-win-x64\.playwright\node\win32_x64\node.exe'
          if (!(Test-Path $driver)) { throw "Playwright driver not packaged at $driver" }
          $marker = Join-Path $env:RUNNER_TEMP 'zerovideo-playwright-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:ZEROVIDEO_PLAYWRIGHT_SMOKE_MARKER = $marker
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            for ($i = 0; $i -lt 75; $i++) {
              if (Test-Path $marker) { break }
              Start-Sleep -Milliseconds 400
              $app.Refresh()
              if ($app.HasExited) { break }
            }
            if (!(Test-Path $marker)) {
              $diagnostics = Join-Path $env:LOCALAPPDATA 'ZeroVideo\diagnostics\startup-crash.log'
              if (Test-Path $diagnostics) { Get-Content $diagnostics -Tail 80 }
              throw "Playwright driver did not start from portable EXE."
            }
            Get-Content $marker | Write-Host
          }
          finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:ZEROVIDEO_PLAYWRIGHT_SMOKE_MARKER -ErrorAction SilentlyContinue
          }
      - name: Upload runnable portable test folder
        uses: actions/upload-artifact@v4
        with:
          name: ZeroVideo-win-x64-playwright-fixed
          path: dist/ZeroVideo-win-x64/
          if-no-files-found: error
          include-hidden-files: true
