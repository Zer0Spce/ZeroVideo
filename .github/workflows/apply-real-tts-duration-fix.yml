name: Apply real Clipchamp TTS duration fix

on:
  push:
    branches:
      - fix/clipchamp-wait-real-tts-duration

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Wait for real Clipchamp TTS duration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        run: python3 .github/scripts/patch-real-tts-duration.py

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ZeroVideo.App/Services/ClipchampTtsService.cs src/ZeroVideo.App/Services/FfmpegService.cs src/ZeroVideo.App/Services/PipelineService.cs .github/scripts/patch-real-tts-duration.py .github/workflows/apply-real-tts-duration-fix.yml
          git commit -m "Wait for real Clipchamp TTS duration"
          git push origin HEAD:fix/clipchamp-wait-real-tts-duration
