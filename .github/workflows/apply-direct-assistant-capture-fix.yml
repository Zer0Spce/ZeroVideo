name: Apply direct assistant response capture fix

on:
  push:
    branches:
      - fix/direct-assistant-response-capture

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-assistant-response-capture
          fetch-depth: 0

      - name: Patch response capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ZeroVideo.App/Services/ChatGptBrowserService.cs')
          text = path.read_text(encoding='utf-8')
          start_marker = '    private static async Task<string?> TryReadLatestResponseAsync(IPage page, IEnumerable<string> configuredSelectors)\n'
          end_marker = '    private static async Task<bool> AnyVisibleAsync(IPage page, IEnumerable<string> selectors)\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''    private static async Task<string?> TryReadLatestResponseAsync(IPage page, IEnumerable<string> configuredSelectors)
    {
        // Prefer ChatGPT's own author marker directly. This reliably captures completed
        // assistant responses without ever reading the JSON example inside the user prompt.
        try
        {
            var directAssistant = page.Locator("[data-message-author-role='assistant']");
            var directCount = await directAssistant.CountAsync();
            for (var i = directCount - 1; i >= 0; i--)
            {
                var item = directAssistant.Nth(i);
                if (!await item.IsVisibleAsync()) continue;
                var text = (await item.InnerTextAsync()).Trim();
                if (LooksLikeJsonPayload(text)) return text;
            }
        }
        catch
        {
            // ChatGPT can replace the latest conversation node while streaming.
        }

        // Fallback for alternate DOM layouts. Only accept nodes that can still be tied to
        // assistant-authored content. Never scan the whole page or user prompt.
        var fallbacks = new[]
        {
            "main article[data-testid^='conversation-turn-']",
            "main [data-testid^='conversation-turn-']",
            "[data-message-author-role='assistant'] .markdown",
            "[data-message-author-role='assistant'] [class*='markdown']"
        };

        foreach (var selector in configuredSelectors.Concat(fallbacks).Where(s => !string.IsNullOrWhiteSpace(s)).Distinct())
        {
            try
            {
                var items = page.Locator(selector);
                var count = await items.CountAsync();
                for (var i = count - 1; i >= 0; i--)
                {
                    var item = items.Nth(i);
                    if (!await item.IsVisibleAsync()) continue;

                    var isAssistant = false;
                    try
                    {
                        var directRole = await item.GetAttributeAsync("data-message-author-role");
                        if (string.Equals(directRole, "assistant", StringComparison.OrdinalIgnoreCase))
                        {
                            isAssistant = true;
                        }
                        else
                        {
                            var assistantAncestor = item.Locator("xpath=ancestor-or-self::*[@data-message-author-role='assistant']").First;
                            if (await assistantAncestor.CountAsync() > 0)
                            {
                                isAssistant = true;
                            }
                            else
                            {
                                var assistantDescendants = await item.Locator("[data-message-author-role='assistant']").CountAsync();
                                var userDescendants = await item.Locator("[data-message-author-role='user']").CountAsync();
                                isAssistant = assistantDescendants > 0 && userDescendants == 0;
                            }
                        }
                    }
                    catch
                    {
                        isAssistant = false;
                    }

                    if (!isAssistant) continue;

                    var text = (await item.InnerTextAsync()).Trim();
                    if (LooksLikeJsonPayload(text)) return text;
                }
            }
            catch
            {
                // Keep trying alternate assistant-specific selectors.
            }
        }

        return null;
    }

'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Remove temporary patch helper
        run: rm .github/workflows/apply-direct-assistant-capture-fix.yml

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ZeroVideo.App/Services/ChatGptBrowserService.cs .github/workflows/apply-direct-assistant-capture-fix.yml
          git commit -m "Fix completed ChatGPT response capture"
          git push origin HEAD:fix/direct-assistant-response-capture
