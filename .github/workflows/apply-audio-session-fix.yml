name: Apply manual voice session audio fix

on:
  push:
    branches:
      - fix/manual-voice-session-audio-validation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Persist manual Clipchamp voice and validate audio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_audio_session_fix.py
      - name: Commit source fix
        shell: bash
        run: |
          rm tools/apply_audio_session_fix.py
          rm .github/workflows/apply-audio-session-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist manual Clipchamp voice and validate audio"
          git push origin HEAD:fix/manual-voice-session-audio-validation
