name: Apply Phase 2 smart editing

on:
  push:
    branches:
      - feature/phase2-smart-editing
    paths:
      - tools/apply_phase2_smart_editing.py
      - .github/workflows/apply-phase2-smart-editing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-smart-editing
          fetch-depth: 0
      - name: Fix patch helper escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_phase2_smart_editing.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)',
              'out, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/apply_phase2_smart_editing.py
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No app changes to commit."
          else
            git commit -m "Add Phase 2 smart editing and comic styles"
            git push origin HEAD:feature/phase2-smart-editing
          fi
