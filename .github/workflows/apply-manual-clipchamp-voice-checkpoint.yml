name: Apply manual Clipchamp voice checkpoint

on:
  push:
    branches:
      - fix/manual-clipchamp-voice-checkpoint

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Add manual Clipchamp voice checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manual TTS checkpoint
        shell: python
        run: |
          from pathlib import Path

          vm = Path('src/ZeroVideo.App/ViewModels/MainViewModel.cs')
          text = vm.read_text()

          text = text.replace(
              '    private bool _newChat;\n',
              '    private bool _newChat;\n    private bool _waitingForTtsContinue;\n    private TaskCompletionSource<bool>? _ttsContinueGate;\n',
              1)

          text = text.replace(
              '        RunPipelineCommand = new AsyncCommand(RunPipelineAsync, CanBuildVideo);\n',
              '        RunPipelineCommand = new AsyncCommand(RunPipelineAsync, CanBuildVideo);\n        ContinueTtsCommand = new RelayCommand(ContinueTts);\n',
              1)

          text = text.replace(
              '    public bool NewChat { get => _newChat; set => Set(ref _newChat, value); }\n',
              '    public bool NewChat { get => _newChat; set => Set(ref _newChat, value); }\n    public bool WaitingForTtsContinue { get => _waitingForTtsContinue; private set => Set(ref _waitingForTtsContinue, value); }\n',
              1)

          text = text.replace(
              '    public ICommand RunPipelineCommand { get; }\n',
              '    public ICommand RunPipelineCommand { get; }\n    public ICommand ContinueTtsCommand { get; }\n',
              1)

          old_pipeline = '''            Status = "Running long-form pipeline...";
            var p = new Progress<double>(x => Progress = x);
            var output = await _pipeline.RunAsync(Project, Settings, Log, p, _cts.Token);'''
          new_pipeline = '''            var needsTts = Project.Chapters.Any(c => string.IsNullOrWhiteSpace(c.AudioPath) || !File.Exists(c.AudioPath));
            if (needsTts)
            {
                _ttsContinueGate = new TaskCompletionSource<bool>(TaskCreationOptions.RunContinuationsAsynchronously);
                WaitingForTtsContinue = true;
                Status = "Clipchamp: choose your voice manually, then click Continue TTS";
                Log("MANUAL TTS: choose the voice you want in Clipchamp. When the Text to speech panel is ready, click Continue TTS in ZeroVideo.");
                await _clip.PrepareManualVoiceSelectionAsync(Settings, Log, _cts.Token);
                await _ttsContinueGate.Task.WaitAsync(_cts.Token);
                WaitingForTtsContinue = false;
                _clip.ConfirmManualVoiceSelection();
                Log("Manual Clipchamp voice confirmed. ZeroVideo will now paste narration and continue TTS without changing your voice.");
            }

            Status = "Running long-form pipeline...";
            var p = new Progress<double>(x => Progress = x);
            var output = await _pipeline.RunAsync(Project, Settings, Log, p, _cts.Token);'''
          if old_pipeline not in text:
              raise SystemExit('RunPipelineAsync anchor not found')
          text = text.replace(old_pipeline, new_pipeline, 1)

          marker = '    private void ArmNewChatIfRequested()\n'
          if marker not in text:
              raise SystemExit('ArmNewChat marker not found')
          continue_method = '''    private void ContinueTts()
    {
        if (!WaitingForTtsContinue || _ttsContinueGate is null) return;
        _ttsContinueGate.TrySetResult(true);
    }

'''
          text = text.replace(marker, continue_method + marker, 1)

          old_fail = '''    private void Fail(Exception ex)
    {
        Status = "Stopped: " + ex.Message;'''
          new_fail = '''    private void Fail(Exception ex)
    {
        WaitingForTtsContinue = false;
        _ttsContinueGate?.TrySetCanceled();
        _ttsContinueGate = null;
        Status = "Stopped: " + ex.Message;'''
          if old_fail not in text:
              raise SystemExit('Fail method anchor not found')
          text = text.replace(old_fail, new_fail, 1)
          vm.write_text(text)

          xaml = Path('src/ZeroVideo.App/MainWindow.xaml')
          ui = xaml.read_text()
          old_buttons = '<WrapPanel><Button Style="{StaticResource PrimaryButton}" Command="{Binding GeneratePlanCommand}" Content="1. Generate project"/><Button Style="{StaticResource SecondaryButton}" Command="{Binding ContinueWritingCommand}" Content="Resume writing"/><Button Style="{StaticResource PrimaryButton}" Command="{Binding RunPipelineCommand}" Content="2. Build video"/></WrapPanel>'
          new_buttons = '<WrapPanel><Button Style="{StaticResource PrimaryButton}" Command="{Binding GeneratePlanCommand}" Content="1. Generate project"/><Button Style="{StaticResource SecondaryButton}" Command="{Binding ContinueWritingCommand}" Content="Resume writing"/><Button Style="{StaticResource PrimaryButton}" Command="{Binding RunPipelineCommand}" Content="2. Build video"/><Button Style="{StaticResource PrimaryButton}" Command="{Binding ContinueTtsCommand}" Content="Continue TTS" IsEnabled="{Binding WaitingForTtsContinue}" ToolTip="After you manually choose the voice in Clipchamp, click here to continue narration and export."/></WrapPanel>'
          if old_buttons not in ui:
              raise SystemExit('Create buttons anchor not found')
          ui = ui.replace(old_buttons, new_buttons, 1)
          xaml.write_text(ui)

          svc = Path('src/ZeroVideo.App/Services/ClipchampTtsService.cs')
          s = svc.read_text()

          class_anchor = 'public sealed class ClipchampTtsService(BrowserSession browser, AutomationProfileService profiles)\n{\n'
          if class_anchor not in s:
              raise SystemExit('Clipchamp class anchor not found')
          s = s.replace(class_anchor, class_anchor + '    private bool _manualVoiceConfirmedForNextChapter;\n\n', 1)

          open_anchor = '''    public Task OpenAsync(ZeroVideoSettings settings)
        => browser.OpenManualAsync(settings, settings.ClipchampUrl);
'''
          if open_anchor not in s:
              raise SystemExit('OpenAsync anchor not found')
          manual_api = open_anchor + '''
    public async Task PrepareManualVoiceSelectionAsync(ZeroVideoSettings settings, Action<string>? log = null, CancellationToken ct = default)
    {
        await browser.EnsureStartedAsync(settings);
        var profile = await profiles.LoadAsync(settings.AutomationProfilePath);
        var page = await browser.GetOrCreatePageAsync("clipchamp");
        await page.GotoAsync(settings.ClipchampUrl, new() { WaitUntil = WaitUntilState.DOMContentLoaded, Timeout = 120000 });

        var entry = await FirstVisibleAcrossFramesAsync(page, profile.Clipchamp.NewVideoButtons, 6000, ct)
            ?? await FirstVisibleAcrossFramesAsync(page, profile.Clipchamp.TextToSpeechButtons, 6000, ct);
        if (entry is not null)
        {
            try
            {
                await entry.ClickAsync(new() { Timeout = 10000 });
                log?.Invoke("Clipchamp: opened Text to speech. Select your voice manually, then return to ZeroVideo and click Continue TTS.");
                await Task.Delay(1200, ct);
                return;
            }
            catch { }
        }

        log?.Invoke("Clipchamp is open. Open Text to speech / Try it manually, choose your voice, then click Continue TTS in ZeroVideo.");
    }

    public void ConfirmManualVoiceSelection()
        => _manualVoiceConfirmedForNextChapter = true;
'''
          s = s.replace(open_anchor, manual_api, 1)

          start = s.find('        var page = await browser.GetOrCreatePageAsync("clipchamp");')
          nav_end_text = '            var input = await WaitForScriptInputAsync(page, profile.Clipchamp.ScriptInputs, 30000, ct)'
          nav_end = s.find(nav_end_text, start)
          if start < 0 or nav_end < 0:
              raise SystemExit('Clipchamp GenerateChapter navigation block not found')

          replacement = '''        var page = await browser.GetOrCreatePageAsync("clipchamp");
        var manualVoiceConfirmed = _manualVoiceConfirmedForNextChapter;
        if (manualVoiceConfirmed)
        {
            _manualVoiceConfirmedForNextChapter = false;
            log?.Invoke($"Clipchamp chapter {chapter.Number}: using the voice you selected manually. ZeroVideo will not change it.");
        }
        else
        {
            var existingInput = await TryFindScriptInputOnceAsync(page, profile.Clipchamp.ScriptInputs);
            if (existingInput is null)
            {
                await page.GotoAsync(settings.ClipchampUrl, new() { WaitUntil = WaitUntilState.DOMContentLoaded, Timeout = 120000 });
                var entry = await FirstVisibleAcrossFramesAsync(page, profile.Clipchamp.NewVideoButtons, 8000, ct)
                    ?? await FirstVisibleAcrossFramesAsync(page, profile.Clipchamp.TextToSpeechButtons, 8000, ct);
                if (entry is not null)
                {
                    await entry.ClickAsync(new() { Timeout = 10000 });
                    await Task.Delay(1200, ct);
                }
            }
            log?.Invoke($"Clipchamp chapter {chapter.Number}: keeping the current manually selected Clipchamp voice.");
        }

        log?.Invoke($"Clipchamp chapter {chapter.Number}: preparing text-to-speech.");

        try
        {
'''
          s = s[:start] + replacement + s[nav_end:]

          # Remove selectedVoice-dependent log after Save; current/manual voice is authoritative now.
          s = s.replace(
              '            log?.Invoke($"TTS created with voice \'{(string.IsNullOrWhiteSpace(selectedVoice) ? "Clipchamp default" : selectedVoice)}\'. Preparing audio-only export...");',
              '            log?.Invoke("TTS created with the current manually selected Clipchamp voice. Preparing audio-only export...");',
              1)

          svc.write_text(s)

          Path('.github/workflows/apply-manual-clipchamp-voice-checkpoint.yml').unlink()

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ZeroVideo.App/ViewModels/MainViewModel.cs src/ZeroVideo.App/MainWindow.xaml src/ZeroVideo.App/Services/ClipchampTtsService.cs .github/workflows/apply-manual-clipchamp-voice-checkpoint.yml
          git commit -m "Add manual Clipchamp voice checkpoint"
          git push origin HEAD:fix/manual-clipchamp-voice-checkpoint
