name: Apply manual Clipchamp voice checkpoint

on:
  push:
    branches:
      - fix/manual-clipchamp-voice-checkpoint

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python3 tools/patch_manual_tts_checkpoint.py
      - name: Commit source fix
        run: |
          rm -f .github/workflows/apply-manual-clipchamp-voice-checkpoint.yml tools/patch_manual_tts_checkpoint.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ZeroVideo.App/ViewModels/MainViewModel.cs src/ZeroVideo.App/MainWindow.xaml src/ZeroVideo.App/Services/ClipchampTtsService.cs .github/workflows/apply-manual-clipchamp-voice-checkpoint.yml tools/patch_manual_tts_checkpoint.py
          git commit -m "Add manual Clipchamp voice checkpoint"
          git push origin HEAD:fix/manual-clipchamp-voice-checkpoint
